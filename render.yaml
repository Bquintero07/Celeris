services:
  # ── Celeris API (Node + Express) ─────────────────────────────────────────────
  - type: web
    name: celeris-api
    runtime: node
    region: oregon
    plan: free
    rootDir: .
    buildCommand: pnpm install --frozen-lockfile --prod=false && pnpm --filter @celeris/shared build && pnpm --filter @celeris/api exec prisma generate && pnpm --filter @celeris/api build
    startCommand: node apps/api/dist/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: AI_SERVICE_URL
        sync: false
      - key: AGENT_SHARED_SECRET
        sync: false
      - key: CORS_ORIGIN
        sync: false

  # ── Celeris AI Agent (Python + FastAPI) ──────────────────────────────────────
  - type: web
    name: celeris-agent
    runtime: python
    region: oregon
    plan: free
    rootDir: agent
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: OPENAI_API_KEY
        sync: false
      - key: MODEL
        value: gpt-4o-mini
      - key: AGENT_SHARED_SECRET
        sync: false
